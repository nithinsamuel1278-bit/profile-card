<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }

    .card {
      width: 300px;
      margin: 60px auto;
      padding: 20px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nithi</h1>
    <p><strong>Role:</strong> Frontend Developer</p>
    <p>I enjoy creating simple and useful websites.</p>
    <p><strong>Skills:</strong> HTML, CSS, JavaScript</p>
    <a href="https://github.com/">Visit my GitHub</a>
  </div>
</body>
</html>
